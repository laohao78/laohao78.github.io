#
# 硅基文明的发展史 — 站点配置
#

name: laohao78
title: "唐昊 · 机器人 · 具身智能"
description: ROS · 机器人 · 具身智能 · 专栏

avatar: /images/avatar.svg

# Footer social links
footer-links:
  github: laohao78/laohao78.github.io
  rss: feed

disqus:
google_analytics:

url: https://laohao78.github.io
baseurl: ""

permalink: /:title/
future: true

version: v2.0.0

# Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

# 所有 collection 源目录统一放在 collections/ 下，保持仓库根目录整洁。
# 注意：设置 collections_dir 后，_posts 也必须在 collections/ 内。
collections_dir: collections

# URL 前缀与 collection 标签保持一致。
collections:
  silicon:
    output: true
    permalink: /silicon/:path/
  navigation:
    output: true
    permalink: /navigation/:path/
  interviews:
    output: true
    permalink: /interviews/:path/
  productivity:
    output: true
    permalink: /productivity/:path/
  threebody:
    output: true
    permalink: /threebody/:path/
  methodology:
    output: true
    permalink: /methodology/:path/
  notes:
    output: true
    permalink: /notes/:path/

plugins:
  - jekyll-sitemap
# jekyll-feed 已移除：它无法把多个 collection 合并成一个 /feed.xml。
# 现由仓库根目录的 feed.xml 自行生成统一订阅源。

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - docs/
