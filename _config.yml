name: 硅基文明的发展史
description: 从第一行代码到文明觉醒

avatar: https://raw.githubusercontent.com/laohao78/laohao78.github.io/main/images/avatar.svg

# Footer social links
footer-links:
  github: laohao78/laohao78.github.io
  rss: feed

disqus:
google_analytics:

url: https://laohao78.github.io
