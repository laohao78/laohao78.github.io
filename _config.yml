#
# 硅基文明的发展史 — 站点配置
#

name: laohao78
description: Robotics Engineer · ROS · Embodied AI

avatar: /images/avatar.svg

# Footer social links
footer-links:
  github: laohao78/laohao78.github.io
  rss: feed

disqus:
google_analytics:

url: https://laohao78.github.io
baseurl: ""

permalink: /:title/
future: true

version: v2.0.0

# Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

collections:
  silicon:
    output: true
  xinzhi:
    output: true
  threebody:
    output: true

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - docs/
