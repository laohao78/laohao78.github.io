<script>
(function() {
  var KEY = 'theme';
  var sel = document.getElementById('theme-select');
  var body = document.body;
  var themes = ['dark', 'light', 'terminal', 'sepia'];

  var current = localStorage.getItem(KEY) || 'dark';
  body.classList.add('theme-' + current);
  sel.value = current;

  sel.addEventListener('change', function() {
    var next = sel.value;
    themes.forEach(function(t) { body.classList.remove('theme-' + t); });
    body.classList.add('theme-' + next);
    localStorage.setItem(KEY, next);
  });
})();
</script>
