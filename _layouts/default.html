<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>{% if page.url == "/" %}{{ site.title | default: site.name }}{% elsif page.title %}{{ page.title }} – {{ site.title | default: site.name }}{% else %}{{ site.title | default: site.name }}{% endif %}</title>

    {% include meta.html %}

    <script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#121417');}}catch(e){}})();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 非阻塞字体加载：网络差或字体域名不可达时，立即用系统字体渲染首屏 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"></noscript>

    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/avatar.svg">
    {% include theme-vars.html %}
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | default: site.name }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead">
          <a href="{{ site.baseurl }}/" class="site-brand">
            <img src="{{ site.avatar }}" alt="{{ site.name }}" />
            <span class="site-name">{{ site.name }}</span>
          </a>

          <nav>
            <div class="nav-dropdown">
              <a href="{{ site.baseurl }}/writing">专栏</a>
              <div class="nav-dropdown-menu">
                <a href="{{ site.baseurl }}/silicon">硅基文明发展史</a>
                <a href="{{ site.baseurl }}/navigation">导航的发展史</a>
                <a href="{{ site.baseurl }}/interviews">与优秀的人同行</a>
                <a href="{{ site.baseurl }}/productivity">新质生产力</a>
                <a href="{{ site.baseurl }}/threebody">三体</a>
                <a href="{{ site.baseurl }}/methodology">方法论</a>
                <a href="{{ site.baseurl }}/notes">技术笔记</a>
              </div>
            </div>
            <a href="{{ site.baseurl }}/projects">项目</a>
            <a href="{{ site.baseurl }}/about">关于</a>
            <button id="theme-toggle" type="button" aria-label="切换深浅主题" title="切换深浅主题">
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <nav class="article-toc" id="article-toc"></nav>
    {% include sidebar.html %}

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          <p class="footer-declaration">laohao78</p>
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
    {% include theme-script.html %}
    <script>
    // 单篇文章内 h2 小标题自动编号（访谈页面已单独处理）
    (function() {
      var post = document.querySelector('article.post');
      if (!post) return;
      var hs = post.querySelectorAll('.entry:not(.interview) h2, .entry:not(.interview) h3');
      if (!hs.length) return;
      var total = hs.length;
      for (var i = 0; i < total; i++) {
        var num = document.createElement('span');
        num.className = 'sec-num';
        num.textContent = '§ ' + (i + 1) + '/' + total;
        hs[i].insertBefore(num, hs[i].firstChild);
      }
    })();
    // 文章右侧小节导航
    (function() {
      var post = document.querySelector('article.post');
      if (!post) return;
      var hs = post.querySelectorAll('.entry h2, .entry h3');
      if (hs.length < 2) return;
      var toc = document.getElementById('article-toc');
      if (!toc) return;
      var ul = document.createElement('ul');
      var items = [];
      hs.forEach(function(h, i) {
        var id = 's' + i;
        h.id = id;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent.replace(/^§ \d+\/\d+ /, '');
        a.title = a.textContent;
        if (h.tagName === 'H3') li.style.paddingRight = '12px';
        li.appendChild(a);
        ul.appendChild(li);
        items.push({ el: h, link: a });
      });
      toc.appendChild(ul);

      // scroll spy
      function update() {
        var cur = items[0];
        for (var i = items.length - 1; i >= 0; i--) {
          if (items[i].el.getBoundingClientRect().top < 120) {
            cur = items[i]; break;
          }
        }
        items.forEach(function(it) { it.link.classList.remove('active'); });
        cur.link.classList.add('active');
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    })();
    </script>
  </body>
</html>
