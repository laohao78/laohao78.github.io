---
layout: default
---

<article class="post">
  {% if page.era %}
  <div class="era-badge">{{ page.era }}</div>
  {% endif %}
  {% if page.category and page.era == nil %}
  <div class="era-badge category-label">{{ page.category }}</div>
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    {{ page.date | date: "%Y年%m月%d日" }}
    {% if page.category %} · {{ page.category }}{% endif %}
  </div>

  {% include disqus.html %}
</article>
