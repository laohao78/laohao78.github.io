---
layout: default
---

<article class="post">
  {% if page.era %}
  <div class="era-badge">{{ page.era }}</div>
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    {{ page.date | date: "%Y年%m月%d日" }}
  </div>

  {% include disqus.html %}
  {% include collection-nav.html %}
</article>
