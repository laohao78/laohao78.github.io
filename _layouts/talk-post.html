---
layout: default
---

<article class="post">
  <div class="era-badge category-label" style="background: rgba(106,180,208,0.12); border-color: rgba(106,180,208,0.25); color: var(--star-blue);">与优秀的人同行</div>
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <span>嘉宾：{{ page.guest }}</span>
  </div>
  <div class="entry interview">{{ content }}</div>
  <div class="date">{{ page.date | date: "%Y年%m月%d日" }}</div>
  {% include collection-nav.html %}
</article>

<script>
// 自动识别提问段落：加 q 类（圆角气泡）+ 序号标记
(function() {
  var ps = document.querySelectorAll('.interview p');
  var qs = [];
  for (var i = 0; i < ps.length; i++) {
    var s = ps[i].querySelector('strong');
    if (s && /^赵松/.test(s.textContent.trim())) {
      qs.push(ps[i]);
    }
  }
  var total = qs.length;
  for (var j = 0; j < total; j++) {
    qs[j].classList.add('q');
    var num = document.createElement('span');
    num.className = 'q-num';
    num.textContent = 'Q' + (j + 1) + '/' + total;
    qs[j].insertBefore(num, qs[j].firstChild);
  }
})();
</script>
