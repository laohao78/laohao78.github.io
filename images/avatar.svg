<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <!-- Silicon crystal lattice -->
  <g filter="url(#glow)" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.9">
    <!-- Central Si atom -->
    <circle cx="100" cy="60" r="8" fill="#00e5ff" stroke="none"/>
    <text x="100" y="64" text-anchor="middle" fill="#0a0a0f" font-size="10" font-family="monospace" font-weight="bold">Si</text>
    <!-- Bonds to corners -->
    <line x1="100" y1="60" x2="55" y2="105"/>
    <line x1="100" y1="60" x2="145" y2="105"/>
    <line x1="100" y1="60" x2="65" y2="155"/>
    <line x1="100" y1="60" x2="135" y2="155"/>
    <!-- Corner atoms -->
    <circle cx="52" cy="110" r="5" fill="#00e5ff" stroke="none" opacity="0.7"/>
    <circle cx="148" cy="110" r="5" fill="#00e5ff" stroke="none" opacity="0.7"/>
    <circle cx="62" cy="155" r="5" fill="#00e5ff" stroke="none" opacity="0.7"/>
    <circle cx="138" cy="155" r="5" fill="#00e5ff" stroke="none" opacity="0.7"/>
  </g>
</svg>
